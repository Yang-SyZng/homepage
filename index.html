<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="yang-syzng's personal homepage — a web page disguised as VS Code" />
  <meta property="og:title" content="yang-syzng · homepage" />
  <meta property="og:description" content="A personal homepage disguised as VS Code. Try Ctrl/Cmd + K" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23007acc'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='white' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E" />
  <title>yang-syzng · homepage</title>
  <link rel="stylesheet" href="./style/base.css?v=9" />
  <link rel="stylesheet" href="./style/titlebar.css?v=9" />
  <link rel="stylesheet" href="./style/activitybar.css?v=9" />
  <link rel="stylesheet" href="./style/sidebar.css?v=9" />
  <link rel="stylesheet" href="./style/editor.css?v=9" />
  <link rel="stylesheet" href="./style/terminal.css?v=9" />
  <link rel="stylesheet" href="./style/statusbar.css?v=9" />
  <link rel="stylesheet" href="./style/palette.css?v=9" />
  <link rel="stylesheet" href="./style/toast.css?v=9" />
  <link rel="stylesheet" href="./style/responsive.css?v=9" />
</head>
<body>
  <div class="window">

  <!-- 标题栏（窗口装饰） -->
  <header class="titlebar">
    <div class="traffic" aria-hidden="true">
      <span class="t-red"></span><span class="t-yellow"></span><span class="t-green"></span>
    </div>
    <div class="titlebar-center">
      <button class="command-center" id="command-center" title="Quick Open (Ctrl/Cmd + P)">
        <span class="cc-file" id="cc-file">README.md</span>
        <span class="cc-sep">—</span>
        <span class="cc-ws">homepage</span>
        <span class="cc-right">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1 1 16.1-3.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m12.6 3.4.65 1.95 1.95.65-1.95.65-.65 1.95-.65-1.95-1.95-.65 1.95-.65.65-1.95z" fill="currentColor" stroke="none"/></svg>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <div class="quick-open hidden" id="quick-open">
        <input class="qo-input" id="qo-input" type="text" placeholder="Search files by name…" autocomplete="off" spellcheck="false" />
        <div class="qo-list" id="qo-list"></div>
      </div>
    </div>
    <button class="palette-hint" id="btn-palette-hint" title="Open command palette">
      <span id="kbd-hint">⌘K</span> <span id="palette-hint-label">Palette</span>
    </button>
  </header>

  <div class="workbench">

    <!-- 最左侧活动栏 -->
    <nav class="activitybar">
      <button class="act-btn active" id="act-files" title="Explorer">
        <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6zM6 3v18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v6h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="act-btn" id="act-search" title="Search / Command Palette">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="act-btn" id="act-terminal" title="Terminal">
        <svg viewBox="0 0 24 24"><path d="M5 16V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m8 9.5 2.5 2.5L8 14.5M12.5 15h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="act-spacer"></div>
      <a class="avatar-btn" href="https://github.com/Yang-SyZng" target="_blank" rel="noopener" title="GitHub Profile">
        <img src="https://github.com/Yang-SyZng.png" alt="yang-syzng" loading="lazy"
             onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23007acc%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22monospace%22 font-size=%2216%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22%3EY%3C/text%3E%3C/svg%3E'" />
      </a>
      <button class="act-btn" id="act-settings" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>

      <!-- 设置弹出菜单 -->
      <div class="settings-menu hidden" id="settings-menu">
        <button class="settings-item" id="menu-theme">
          <span id="menu-theme-icon">🌚</span>
          <span id="menu-theme-label">Toggle Light / Dark Theme</span>
          <span class="mi-state" id="menu-theme-state">Dark</span>
        </button>
        <button class="settings-item" id="menu-lang">
          <span>🌐</span>
          <span>Language / 语言</span>
          <span class="mi-state" id="menu-lang-state">English</span>
        </button>
      </div>
    </nav>

    <!-- 资源管理器侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title" id="sb-title">Explorer</div>
      <div class="sidebar-section" id="file-tree"><!-- rendered by js/editor.js --></div>
      <div class="sidebar-section outline">
        <div class="outline-title" id="ol-title">Outline</div>
        <div class="outline-item">▣&nbsp; const me = {…}</div>
        <div class="outline-item">◈&nbsp; function greeting()</div>
        <div class="outline-item">◆&nbsp; export default me</div>
      </div>
    </aside>

    <!-- 编辑器主区（编辑器组：主组 + 可选的预览组，同 VS Code 多分组布局） -->
    <main class="main">
      <div class="editor-groups">
        <div class="editor-group" id="group-main">
          <div class="tabs">
            <div class="tabs-scroll" id="tabs-scroll"><!-- 由 js/editor.js 渲染 --></div>
            <div class="tabs-actions" id="tabs-actions"><!-- 由 js/editor.js 渲染 --></div>
          </div>
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="editor-wrap">
            <div class="editor-area">
              <div class="editor" id="editor"></div>
            </div>
            <div class="minimap" id="minimap" aria-hidden="true"></div>
          </div>
        </div>
        <div class="editor-group preview-group hidden" id="group-preview">
          <div class="tabs">
            <div class="tabs-scroll">
              <div class="tab active" id="preview-tab">
                <svg class="fico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#519aba"></circle><path d="M4 10.5V6.2l2.1 2.5L8.2 6.2v4.3" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10.9 6.8v3.2M10.9 10l-1.3-1.35M10.9 10l1.3-1.35" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span id="preview-tab-label">Preview</span>
                <button class="tab-close" id="preview-close" title="Close Preview">✕</button>
              </div>
            </div>
          </div>
          <div class="preview-body" id="preview-body"></div>
        </div>
      </div>

      <!-- 假终端 -->
      <div class="terminal hidden" id="terminal">
        <div class="terminal-tabs">
          <span class="terminal-tab active">bash</span>
          <span class="terminal-spacer"></span>
          <button class="terminal-close" id="terminal-hide" title="Close Terminal">✕</button>
        </div>
        <div class="terminal-body" id="terminal-body"></div>
        <div class="terminal-input-row">
          <span class="terminal-prompt">visitor@yang-syzng:~$</span>
          <input id="terminal-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type help for available commands…" />
        </div>
      </div>
    </main>
  </div>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <div class="status-left">
      <span class="status-item status-remote" id="status-remote" title="Remote"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 3h2v10H3zM8 3h5v3H8zM8 10h5v3H8zM11 6v4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>&nbsp;homepage</span>
      <button class="status-item" id="status-branch" title="Branch"><svg class="sb-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M14 5.5C14 4.121 12.879 3 11.5 3C10.121 3 9 4.121 9 5.5C9 6.682 9.826 7.669 10.93 7.928C10.744 8.546 10.177 9 9.5 9H6.5C5.935 9 5.419 9.195 5 9.512V4.949C6.14 4.717 7 3.707 7 2.5C7 1.121 5.879 0 4.5 0C3.121 0 2 1.121 2 2.5C2 3.708 2.86 4.717 4 4.949V11.05C2.86 11.282 2 12.292 2 13.499C2 14.878 3.121 15.999 4.5 15.999C5.879 15.999 7 14.878 7 13.499C7 12.317 6.174 11.33 5.07 11.071C5.256 10.453 5.823 9.999 6.5 9.999H9.5C10.723 9.999 11.74 9.115 11.954 7.953C13.116 7.738 14 6.723 14 5.5ZM3 2.5C3 1.673 3.673 1 4.5 1C5.327 1 6 1.673 6 2.5C6 3.327 5.327 4 4.5 4C3.673 4 3 3.327 3 2.5ZM6 13.5C6 14.327 5.327 15 4.5 15C3.673 15 3 14.327 3 13.5C3 12.673 3.673 12 4.5 12C5.327 12 6 12.673 6 13.5ZM11.5 7C10.673 7 10 6.327 10 5.5C10 4.673 10.673 4 11.5 4C12.327 4 13 4.673 13 5.5C13 6.327 12.327 7 11.5 7Z"/></svg><span>main</span><svg class="sb-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M14 3.5V6.5C14 6.78 13.78 7 13.5 7H10.5C10.22 7 9.99999 6.78 9.99999 6.5C9.99999 6.22 10.22 6 10.5 6H12.58C11.78 4.17 10.01 3 7.99999 3C5.77999 3 3.79999 4.5 3.18999 6.64C3.12999 6.86 2.92999 7 2.70999 7C2.65999 7 2.61999 7 2.56999 6.98C2.29999 6.9 2.14999 6.63 2.22999 6.36C2.95999 3.79 5.32999 2 7.99999 2C10.05 2 11.91 3.02 13 4.69V3.5C13 3.22 13.22 3 13.5 3C13.78 3 14 3.22 14 3.5ZM13.42 9.02C13.16 8.95 12.88 9.1 12.8 9.37C12.19 11.51 10.22 13.01 7.98999 13.01C5.97999 13.01 4.20999 11.84 3.40999 10.01H5.48999C5.76999 10.01 5.98999 9.79 5.98999 9.51C5.98999 9.23 5.76999 9.01 5.48999 9.01H2.48999C2.20999 9.01 1.98999 9.23 1.98999 9.51V12.51C1.98999 12.79 2.20999 13.01 2.48999 13.01C2.76999 13.01 2.98999 12.79 2.98999 12.51V11.32C4.07999 12.98 5.93999 14.01 7.98999 14.01C10.66 14.01 13.03 12.22 13.76 9.65C13.84 9.38 13.68 9.11 13.41 9.03L13.42 9.02Z"/></svg></button>
      <span class="status-item" id="status-problems" title="0 problems">✓ 0 <span class="dim">⚠ 0</span></span>
    </div>
    <div class="status-right">
      <span class="status-item hide-sm">Ln 42, Col 80</span>
      <span class="status-item hide-sm">Spaces: 2</span>
      <span class="status-item hide-sm">UTF-8</span>
      <span class="status-item hide-sm" id="status-lang">TypeScript</span>
      <button class="status-item" id="status-theme" title="Toggle theme">🌚</button>
      <span class="status-item" id="status-bell" title="Notifications">🔔</span>
    </div>
  </footer>

  </div><!-- /.window -->

  <!-- 命令面板 -->
  <div class="palette-backdrop hidden" id="palette">
    <div class="palette">
      <input class="palette-input" id="palette-input" type="text" placeholder="Type a command or search…" autocomplete="off" spellcheck="false" />
      <ul class="palette-list" id="palette-list"></ul>
      <div class="palette-foot">
        <span id="pf-up"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span id="pf-run"><kbd>↵</kbd> run</span>
        <span id="pf-esc"><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- 通知气泡 -->
  <div class="toast hidden" id="toast">
    <div class="toast-text" id="toast-text"></div>
    <button class="toast-close" id="toast-close">✕</button>
  </div>

  <script type="module" src="./js/main.js?v=9"></script>
</body>
</html>
